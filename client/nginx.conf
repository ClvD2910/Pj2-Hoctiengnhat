# =============================================================
# client/nginx.conf
# Nginx configuration tối ưu cho React SPA (Vite build output)
# =============================================================

server {
    listen 80;
    server_name _;

    # Thư mục chứa file static do Vite build (đã COPY vào trong Dockerfile)
    root /usr/share/nginx/html;
    index index.html;

    # ── Bật Gzip để giảm bandwidth ──────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # ── Proxy API requests → backend container ───────────────────
    # Mọi request bắt đầu bằng /api hoặc /uploads đều được forward
    # tới service "server" trong Docker network (tên service = hostname)
    location /api {
        proxy_pass         http://server:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
    }

    location /uploads {
        proxy_pass         http://server:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── Cache dài hạn cho static assets (JS/CSS/fonts/images) ───
    # Vite đã content-hash tên file nên cache vĩnh viễn là an toàn
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── React Router fallback (SPA) ──────────────────────────────
    # Khi người dùng truy cập trực tiếp /search, /notebooks/123, v.v.
    # Nginx trả về index.html để React Router tự xử lý routing phía client
    location / {
        try_files $uri $uri/ /index.html;
    }
}
