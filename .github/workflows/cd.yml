# =============================================================
# .github/workflows/cd.yml
# CD Pipeline — Chạy khi code được push/merge vào nhánh `main`
#
# Quy trình:
#   1. Build và push Docker images lên Docker Hub
#   2. SSH vào VPS, pull images mới và khởi động lại containers
# =============================================================

name: CD — Build, Push & Deploy to Production

on:
  push:
    branches:
      - main

jobs:

  # ────────────────────────────────────────────────────────────
  # Job 1: Build images và push lên Docker Hub
  # ────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest

    # Expose IMAGE_TAG ra các job khác (dùng short SHA để tag image)
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Tạo image tag từ short SHA của commit (ví dụ: a1b2c3d)
      - name: Generate image tag
        id: meta
        run: echo "version=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Đăng nhập Docker Hub bằng Secrets đã thiết lập trong GitHub repo
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build và push server image với 2 tag: commit SHA + latest
      - name: Build & Push server image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/jvocab-server:${{ steps.meta.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/jvocab-server:latest

      # Build và push client image với 2 tag: commit SHA + latest
      - name: Build & Push client image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/jvocab-client:${{ steps.meta.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/jvocab-client:latest

  # ────────────────────────────────────────────────────────────
  # Job 2: Deploy lên VPS qua SSH
  # Chỉ chạy sau khi build-and-push hoàn thành thành công
  # ────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Truyền image tag vào script để pull đúng version vừa build
          envs: IMAGE_TAG,DOCKERHUB_USERNAME
          script_stop: true  # Dừng ngay nếu bất kỳ lệnh nào thất bại
          script: |
            # Di chuyển vào thư mục chứa docker-compose.prod.yml trên VPS
            cd ${{ secrets.VPS_APP_DIR }}

            # Cập nhật các biến image tag trong .env (hoặc export trực tiếp)
            export IMAGE_TAG="${{ needs.build-and-push.outputs.image_tag }}"
            export DOCKERHUB_USERNAME="${{ secrets.DOCKERHUB_USERNAME }}"

            # Pull images mới nhất từ Docker Hub
            docker compose -f docker-compose.prod.yml pull

            # Khởi động lại các services với zero-downtime
            # --remove-orphans: dọn dẹp container cũ không còn trong compose file
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Dọn dẹp images cũ để tiết kiệm disk space
            docker image prune -f
